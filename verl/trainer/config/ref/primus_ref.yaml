defaults:
  - ref
  - ../engine@primus: primus
  - _self_

_target_: verl.workers.config.PrimusActorConfig
strategy: primus

entropy_from_logits_with_chunking: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_with_chunking,false}
entropy_from_logits_chunk_size: ${oc.select:actor_rollout_ref.actor.entropy_from_logits_chunk_size,2048}

primus:
  primus_config_path: ${actor_rollout_ref.actor.primus.primus_config_path}
  primus_module: ${actor_rollout_ref.actor.primus.primus_module}
  primus_path: ${actor_rollout_ref.actor.primus.primus_path}
  primus_turbo_path: ${actor_rollout_ref.actor.primus.primus_turbo_path}
  primus_overrides: ${actor_rollout_ref.actor.primus.primus_overrides}
  primus_patches: ${actor_rollout_ref.actor.primus.primus_patches}
  seed: ${actor_rollout_ref.actor.primus.seed}
  forward_only: true
  use_remove_padding: ${actor_rollout_ref.actor.primus.use_remove_padding}
